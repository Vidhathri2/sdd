<div class="h-screen w-screen bg-[#f0f2f5] text-slate-700 font-sans flex flex-col p-4 md:p-6 overflow-hidden">
  <div class="flex-1 flex flex-col min-h-0 space-y-4">

    <!-- Top Navigation Bar / Header -->
    <header class="flex items-center justify-between bg-white px-6 py-3 rounded-2xl border border-gray-200 shadow-sm gap-4 shrink-0">
      <!-- Left side: Hamburger and title -->
      <div class="flex items-center gap-3 text-gray-800">
        <button type="button" class="text-gray-500 hover:text-gray-800 focus:outline-none" (click)="onBack()">
          <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
          </svg>
        </button>
        <span class="text-lg font-bold tracking-tight text-gray-855 cursor-pointer" (click)="onBack()">Deal Studio</span>
      </div>

      <!-- Middle side: Search input field -->
      <div class="relative w-full max-w-md hidden sm:block">
        <input 
          type="text" 
          placeholder="Search" 
          class="w-full pl-5 pr-10 py-2 bg-[#f0f2f5] border border-transparent rounded-full text-gray-700 placeholder-gray-450 text-sm focus:outline-none focus:bg-white focus:border-gray-300 transition-all duration-200"
        />
        <span class="absolute inset-y-0 right-0 flex items-center pr-4 pointer-events-none text-gray-400">
          <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
          </svg>
        </span>
      </div>

      <!-- Right side: Utility icons -->
      <div class="flex items-center gap-4 text-gray-550">
        <button type="button" class="hover:text-gray-800 transition-colors">
          <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
          </svg>
        </button>
        <button type="button" class="hover:text-gray-800 transition-colors">
          <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.907c.961 0 1.36 1.252.584 1.83l-3.97 2.883a1 1 0 00-.364 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.971-2.883a1 1 0 00-1.175 0l-3.97 2.883c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.364-1.118l-3.97-2.883c-.777-.579-.378-1.83.584-1.83h4.907a1 1 0 00.95-.69l1.519-4.674z" />
          </svg>
        </button>
        <div class="h-7 w-7 rounded-full bg-blue-100 border border-gray-300 flex items-center justify-center overflow-hidden shrink-0">
          <svg class="h-full w-full text-blue-500" fill="currentColor" viewBox="0 0 24 24">
            <path d="M24 20.993V24H0v-2.996A14.977 14.977 0 0112.004 15c4.904 0 9.26 2.354 11.996 5.993zM16.002 8.999a4 4 0 11-8 0 4 4 0 018 0z" />
          </svg>
        </div>
      </div>
    </header>

    <!-- Main Container Card -->
    <div class="bg-white rounded-2xl border border-gray-200 shadow-sm p-5 md:p-6 flex-1 flex flex-col min-h-0 overflow-hidden">
      
      <!-- Back Arrow and Title -->
      <div class="flex items-center gap-3 mb-6">
        <button 
          type="button" 
          (click)="onBack()" 
          class="back-btn p-1.5 rounded-lg text-gray-500 hover:bg-gray-100 hover:text-gray-800 transition-colors flex items-center"
        >
          <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
          </svg>
        </button>
        <h2 class="page-title text-xl font-bold text-gray-850">Select products</h2>
      </div>

      <!-- Keyword Search input field -->
      <div class="relative w-full mb-6">
        <input 
          type="text" 
          placeholder="Search by keyword" 
          [value]="searchQuery"
          (input)="onSearchInput($event)"
          class="w-full pl-5 pr-12 py-3 bg-[#f0f2f5] border border-transparent rounded-xl text-gray-800 placeholder-gray-500 text-sm focus:outline-none focus:bg-white focus:border-gray-200 transition-all duration-200"
        />
        <span class="absolute inset-y-0 right-0 flex items-center pr-5 pointer-events-none text-gray-400">
          <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
          </svg>
        </span>
      </div>

      <!-- Grid for Product catalog columns -->
      <div class="grid grid-cols-1 md:grid-cols-4 gap-6 items-stretch flex-1 min-h-0 overflow-hidden">
        
        <!-- Left Sidebar: Product Family selection -->
        <aside class="md:col-span-1 space-y-4 overflow-y-auto max-h-full">
          <div class="bg-[#f0f2f5] rounded-2xl p-5 border border-transparent">
            <h3 class="text-xs font-bold text-gray-500 uppercase tracking-wider mb-3">Product family</h3>
            <ul class="space-y-1">
              <li *ngFor="let fam of families">
                <button 
                  type="button" 
                  (click)="selectFamily(fam)"
                  class="sidebar-filter w-full text-left px-3.5 py-2.5 rounded-xl text-sm transition-all duration-150 font-medium"
                  [ngClass]="selectedFamily === fam 
                    ? 'bg-[#dbeafe] text-blue-700 font-semibold' 
                    : 'text-gray-600 hover:bg-[#e2e8f0] hover:text-gray-850'"
                >
                  {{ fam }}
                </button>
              </li>
            </ul>
          </div>
        </aside>

        <!-- Center Panel: Products List -->
        <main 
          [ngClass]="isCartOpen && cart.length > 0 ? 'md:col-span-2' : 'md:col-span-3'" 
          class="space-y-3 min-w-0 transition-all duration-300 overflow-y-auto max-h-full pr-1"
        >
          <!-- Loading State -->
          <div *ngIf="isLoading" class="py-20 flex flex-col items-center justify-center gap-2">
            <div class="w-8 h-8 border-2 border-gray-300 border-t-blue-600 rounded-full animate-spin"></div>
            <p class="text-gray-400 text-xs font-medium">Loading products...</p>
          </div>

          <!-- Empty State -->
          <div *ngIf="!isLoading && filteredProducts.length === 0" class="py-20 text-center flex flex-col items-center justify-center gap-2 border-2 border-dashed border-gray-200 rounded-2xl bg-gray-50/50">
            <p class="text-gray-550 font-bold text-sm">No products match your search.</p>
            <p class="text-gray-400 text-xs">Try a different keyword or filter family.</p>
          </div>

          <!-- Products Single-Column List -->
          <div *ngIf="!isLoading && filteredProducts.length > 0" class="space-y-3">
            <div 
              *ngFor="let prod of filteredProducts" 
              class="product-card bg-white border border-gray-150 rounded-2xl p-5 flex items-center justify-between gap-4 transition-all duration-200 hover:border-gray-250 shadow-sm min-w-0"
            >
              <div class="flex items-center gap-4 min-w-0">
                <!-- Icon Box based on family type -->
                <div class="h-12 w-12 rounded-xl bg-[#f8fafc] border border-gray-150 flex items-center justify-center shrink-0 shadow-inner">
                  <!-- Chrome Logo SVG -->
                  <svg *ngIf="prod.icon === 'Chrome'" class="h-6 w-6" viewBox="0 0 24 24" fill="none">
                    <circle cx="12" cy="12" r="10" fill="#E2E8F0"/>
                    <path d="M12 2a10 10 0 0 1 10 10c0 .96-.13 1.88-.38 2.76l-4.62-8A4 4 0 0 0 12 6V2z" fill="#EA4335"/>
                    <path d="M21.62 14.76A10 10 0 0 1 12 22c-3.74 0-7.05-2.05-8.8-5.1l4.62-8A4 4 0 0 0 12 18h9.62z" fill="#34A853"/>
                    <path d="M3.2 16.9A10 10 0 0 1 2 12c0-4.72 3.28-8.68 7.7-9.74l4.62 8A4 4 0 0 0 12 12v6L3.2 16.9z" fill="#FBBC05"/>
                    <circle cx="12" cy="12" r="4" fill="#FFFFFF"/>
                    <circle cx="12" cy="12" r="3" fill="#4285F4"/>
                  </svg>
                  
                  <!-- GCP Logo SVG -->
                  <svg *ngIf="prod.icon === 'GCP'" class="h-6 w-6" viewBox="0 0 24 24" fill="none">
                    <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z" fill="#4285F4"/>
                    <path d="M19.35 10.04c-.1-.53-.28-1.04-.52-1.52L12 14.5h7.35c0-.15 0-.31-.05-.46-.07-2.64-2.05-4.78-4.65-4.96z" fill="#EA4335"/>
                    <path d="M12 4c1.88 0 3.6.78 4.88 2.04l-3.32 3.32C13.1 9.12 12.58 9 12 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.58 0 1.1-.12 1.56-.36l3.32-3.32C15.6 13.9 13.88 15 12 15c-3.31 0-6-2.69-6-6s2.69-6 6-6z" fill="#FBBC05"/>
                    <path d="M6 14c0 .88.22 1.71.6 2.44L12 11.5H4.65C4.22 12.23 4 13.09 4 14c0 3.31 2.69 6 6 6h2l-6-6z" fill="#34A853"/>
                  </svg>
                  
                  <!-- Maps Logo SVG -->
                  <svg *ngIf="prod.icon === 'Maps'" class="h-6 w-6" viewBox="0 0 24 24" fill="none">
                    <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z" fill="#EA4335"/>
                    <path d="M12 21.5s-6-6.62-6-12.5c0-3.31 2.69-6 6-6s6 2.69 6 6c0 5.88-6 12.5-6 12.5z" stroke="#34A853" stroke-width="1"/>
                  </svg>
                  
                  <!-- Workspace Logo SVG -->
                  <svg *ngIf="prod.icon === 'Workspace'" class="h-6 w-6" viewBox="0 0 24 24" fill="none">
                    <rect x="2" y="4" width="20" height="16" rx="3" fill="#EA4335"/>
                    <path d="M2 7l10 6 10-6" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
                    <rect x="5" y="8" width="14" height="10" rx="1" fill="#4285F4"/>
                    <path d="M5 11l7 4 7-4" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
                  </svg>
                  
                  <!-- PSO Logo SVG -->
                  <svg *ngIf="prod.icon === 'PSO'" class="h-6 w-6" viewBox="0 0 24 24" fill="none">
                    <rect x="3" y="6" width="18" height="13" rx="2" stroke="#4285F4" stroke-width="2"/>
                    <path d="M9 6V4a2 2 0 0 1 2-2h2a2 2 0 0 1 2-2v2" stroke="#4285F4" stroke-width="2"/>
                    <line x1="3" y1="11" x2="21" y2="11" stroke="#4285F4" stroke-width="2"/>
                  </svg>
                </div>
                
                <!-- Product Metadata -->
                <div class="flex flex-col min-w-0">
                  <h4 class="product-name text-base font-bold text-gray-800 truncate">{{ prod.name }}</h4>
                  <div class="flex items-center gap-1.5 text-xs text-gray-400 mt-1">
                    <span class="inline-block w-2 h-2 rounded-full bg-blue-500"></span>
                    <span>{{ prod.family }}</span>
                  </div>
                </div>
              </div>

              <!-- Add/Remove Toggle Action -->
              <button 
                type="button" 
                (click)="toggleCart(prod)"
                [disabled]="!isInCart(prod.id) && cart.length >= 1"
                class="add-btn px-5 py-2 rounded-full text-xs font-semibold shadow-sm transition-all duration-150 flex items-center gap-1.5 shrink-0"
                [ngClass]="isInCart(prod.id) 
                  ? 'bg-[#e0f2fe] text-[#0369a1] font-bold border border-transparent hover:bg-blue-100 hover:text-blue-800' 
                  : (!isInCart(prod.id) && cart.length >= 1)
                  ? 'bg-gray-100 text-gray-400 border-gray-200 cursor-not-allowed'
                  : 'bg-white hover:bg-gray-50 text-gray-700 border border-gray-300'"
              >
                <span *ngIf="isInCart(prod.id)" class="flex items-center gap-1">
                  <svg class="h-4 w-4 inline text-blue-600 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7" />
                  </svg>
                  Added
                </span>
                <span *ngIf="!isInCart(prod.id)">+ Add</span>
              </button>
            </div>
          </div>
        </main>

        <!-- Right Side: Added products column -->
        <aside 
          *ngIf="isCartOpen && cart.length > 0" 
          class="md:col-span-1 cart-drawer bg-white border border-gray-200 rounded-2xl shadow-sm overflow-hidden flex flex-col justify-between max-h-full"
        >
          <!-- Cart Header -->
          <div class="px-5 py-4 border-b border-gray-150 flex items-center justify-between">
            <h3 class="font-bold text-gray-800 text-sm">Added products</h3>
            <button 
              type="button" 
              (click)="closeCart()"
              class="close-cart-btn p-1.5 rounded-lg text-gray-400 hover:bg-gray-100 hover:text-gray-700 transition-colors"
            >
              <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
              </svg>
            </button>
          </div>

          <!-- Selected Products list inside cart drawer -->
          <div class="p-4 space-y-3 flex-1 overflow-y-auto max-h-96">
            <div 
              *ngFor="let item of cart" 
              class="added-product-item bg-[#f8fafc] border border-gray-150 rounded-xl p-3 flex items-center justify-between gap-3 min-w-0"
            >
              <div class="flex items-center gap-2.5 min-w-0">
                <!-- Icon Box with exact colored SVG inside the cart item -->
                <div class="h-8 w-8 rounded-lg bg-white border border-gray-150 flex items-center justify-center shrink-0 shadow-inner">
                  <!-- Chrome Logo SVG -->
                  <svg *ngIf="item.icon === 'Chrome'" class="h-5 w-5" viewBox="0 0 24 24" fill="none">
                    <circle cx="12" cy="12" r="10" fill="#E2E8F0"/>
                    <path d="M12 2a10 10 0 0 1 10 10c0 .96-.13 1.88-.38 2.76l-4.62-8A4 4 0 0 0 12 6V2z" fill="#EA4335"/>
                    <path d="M21.62 14.76A10 10 0 0 1 12 22c-3.74 0-7.05-2.05-8.8-5.1l4.62-8A4 4 0 0 0 12 18h9.62z" fill="#34A853"/>
                    <path d="M3.2 16.9A10 10 0 0 1 2 12c0-4.72 3.28-8.68 7.7-9.74l4.62 8A4 4 0 0 0 12 12v6L3.2 16.9z" fill="#FBBC05"/>
                    <circle cx="12" cy="12" r="4" fill="#FFFFFF"/>
                    <circle cx="12" cy="12" r="3" fill="#4285F4"/>
                  </svg>
                  
                  <!-- GCP Logo SVG -->
                  <svg *ngIf="item.icon === 'GCP'" class="h-5 w-5" viewBox="0 0 24 24" fill="none">
                    <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z" fill="#4285F4"/>
                    <path d="M19.35 10.04c-.1-.53-.28-1.04-.52-1.52L12 14.5h7.35c0-.15 0-.31-.05-.46-.07-2.64-2.05-4.78-4.65-4.96z" fill="#EA4335"/>
                    <path d="M12 4c1.88 0 3.6.78 4.88 2.04l-3.32 3.32C13.1 9.12 12.58 9 12 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.58 0 1.1-.12 1.56-.36l3.32-3.32C15.6 13.9 13.88 15 12 15c-3.31 0-6-2.69-6-6s2.69-6 6-6z" fill="#FBBC05"/>
                    <path d="M6 14c0 .88.22 1.71.6 2.44L12 11.5H4.65C4.22 12.23 4 13.09 4 14c0 3.31 2.69 6 6 6h2l-6-6z" fill="#34A853"/>
                  </svg>
                  
                  <!-- Maps Logo SVG -->
                  <svg *ngIf="item.icon === 'Maps'" class="h-5 w-5" viewBox="0 0 24 24" fill="none">
                    <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z" fill="#EA4335"/>
                    <path d="M12 21.5s-6-6.62-6-12.5c0-3.31 2.69-6 6-6s6 2.69 6 6c0 5.88-6 12.5-6 12.5z" stroke="#34A853" stroke-width="1"/>
                  </svg>
                  
                  <!-- Workspace Logo SVG -->
                  <svg *ngIf="item.icon === 'Workspace'" class="h-5 w-5" viewBox="0 0 24 24" fill="none">
                    <rect x="2" y="4" width="20" height="16" rx="3" fill="#EA4335"/>
                    <path d="M2 7l10 6 10-6" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
                    <rect x="5" y="8" width="14" height="10" rx="1" fill="#4285F4"/>
                    <path d="M5 11l7 4 7-4" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
                  </svg>
                  
                  <!-- PSO Logo SVG -->
                  <svg *ngIf="item.icon === 'PSO'" class="h-5 w-5" viewBox="0 0 24 24" fill="none">
                    <rect x="3" y="6" width="18" height="13" rx="2" stroke="#4285F4" stroke-width="2"/>
                    <path d="M9 6V4a2 2 0 0 1 2-2h2a2 2 0 0 1 2-2v2" stroke="#4285F4" stroke-width="2"/>
                    <line x1="3" y1="11" x2="21" y2="11" stroke="#4285F4" stroke-width="2"/>
                  </svg>
                </div>
                <div class="min-w-0">
                  <span class="text-[9px] font-bold text-gray-400 uppercase tracking-wider block leading-none">{{ item.family }}</span>
                  <h5 class="text-xs font-bold text-gray-800 truncate mt-0.5">{{ item.name }}</h5>
                </div>
              </div>
              
              <!-- Remove/Trash Icon Button -->
              <button 
                type="button" 
                (click)="removeFromCart(item.id)" 
                class="text-gray-450 hover:text-red-500 transition-colors shrink-0"
              >
                <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                </svg>
              </button>
            </div>
          </div>

          <!-- Checkout button footer matching mockup centered layout -->
          <div class="p-5 border-t border-gray-150 bg-gray-50/50 flex justify-center">
            <button 
              type="button" 
              (click)="onContinue()"
              class="continue-btn w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 px-4 rounded-full text-sm shadow-sm hover:shadow transition-all duration-150 flex items-center justify-center gap-2"
            >
              <span>Continue</span>
            </button>
          </div>
        </aside>

      </div>

    </div>
  </div>
</div>
